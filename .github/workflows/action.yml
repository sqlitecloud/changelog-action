name: Release and Update Website Changelog

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      create_release:
        required: false
        type: boolean
        default: true
      stage_branch:
        # Staging branch on the website repo that changelog PRs target and are auto-merged into.
        # An input (not hardcoded) so the internal branch name is not baked into this public file.
        required: true
        type: string
      base_branch:
        # Branch that staged changelog changes are promoted into via a follow-up PR.
        required: false
        type: string
        default: main
    secrets:
      personal_access_token:
        required: true
      website_repo:
        # Target website repository in "owner/repo" form.
        # Kept as a secret so the repo name is not exposed in this public workflow file.
        required: true
      website_changelog_dir:
        # Repo-relative directory where changelog JSON files are written
        # (e.g. "path/to/changelogs"). Secret to avoid exposing the real path.
        required: true

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          STAGE_BRANCH: ${{ inputs.stage_branch }}
        run: |
          # `stage_branch` is required, but GitHub's "required" only checks the key is
          # present — an empty string (e.g. an unset caller variable) still passes and would
          # make the changelog PR silently target the website repo's default branch. Fail fast.
          if [ -z "$STAGE_BRANCH" ]; then
            echo "❌ ERROR: 'stage_branch' is empty."
            echo "   Set it on the caller (e.g. a WEBSITE_STAGE_BRANCH variable) so changelog"
            echo "   PRs target the intended staging branch instead of the default branch."
            exit 1
          fi
          echo "✓ stage_branch = $STAGE_BRANCH"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        env:
          # Through the env rather than interpolated into the script: it is a dispatch input,
          # so its value is chosen by whoever runs the workflow.
          TEST_VERSION: ${{ github.event.inputs.test_version }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # A caller's tag may or may not carry a v: sqlite-js tags 1.4.3, where others tag
            # v1.4.3. Taking off refs/tags/ and then an optional v reads both as 1.4.3, where
            # stripping "refs/tags/v" in one go left a bare tag as the whole refs/tags/1.4.3,
            # which the version check further down then rejected.
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          else
            VERSION=$TEST_VERSION
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # VERSION is a shell variable now, so this URL no longer comes out without it.
          echo "URL=${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSION" >> $GITHUB_OUTPUT

      - name: Extract Full Changelog for Release
        id: extract_full_changelog
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          echo $VERSION
          CHANGELOG_BODY=$(awk -v ver="$VERSION" '/^## \[/ {if (p) exit; if ($0 ~ "\\[" ver "\\]") p=1; next} p' CHANGELOG.md | sed 's/ *\*\*\[PRIVATE\]\*\* */ /g')
          echo "CHANGELOG_BODY<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: v${{ steps.get_version.outputs.VERSION }}
          body: ${{ env.CHANGELOG_BODY }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- START OF NEW ADDITIONAL STEPS ---

      - name: Extract User-Facing Changelog and Generate JSON
        id: extract_and_generate
        env:
          WEBSITE_CHANGELOG_DIR: ${{ secrets.website_changelog_dir }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          SYSTEM_NAME="${{ inputs.name }}"

          echo "🔍 Extracting changelog for version: $VERSION"

          # Check if CHANGELOG.md exists
          if [ ! -f "CHANGELOG.md" ]; then
            echo "❌ ERROR: CHANGELOG.md not found in repository root"
            exit 1
          fi

          # Validate version format (should be X.Y.Z)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ ERROR: Invalid version format '$VERSION'. Expected format: X.Y.Z (e.g., 1.2.3)"
            exit 1
          fi

          # Extract the changelog line for this version
          CHANGELOG_LINE=$(grep "^## \[$VERSION\]" CHANGELOG.md)

          if [ -z "$CHANGELOG_LINE" ]; then
            echo "❌ ERROR: Version [$VERSION] not found in CHANGELOG.md"
            echo "📋 Available versions in CHANGELOG.md:"
            grep "^## \[" CHANGELOG.md | head -5
            exit 1
          fi

          echo "✓ Found changelog entry: $CHANGELOG_LINE"

          # Extract release date from CHANGELOG.md
          RELEASE_DATE=$(echo "$CHANGELOG_LINE" | sed -E 's/^## \[.*\] - ([0-9]{4}-[0-9]{2}-[0-9]{2}).*$/\1/')

          # Validate that date was extracted
          if [ -z "$RELEASE_DATE" ]; then
            echo "❌ ERROR: Could not extract date from changelog line: $CHANGELOG_LINE"
            echo "Expected format: ## [$VERSION] - YYYY-MM-DD"
            exit 1
          fi

          # Validate date format (YYYY-MM-DD)
          if ! echo "$RELEASE_DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "❌ ERROR: Invalid date format '$RELEASE_DATE'. Expected format: YYYY-MM-DD (e.g., 2024-01-15)"
            exit 1
          fi

          # Validate that the extracted date matches what we found (not just any 4 digits)
          if [ "$RELEASE_DATE" = "$CHANGELOG_LINE" ]; then
            echo "❌ ERROR: Date extraction failed. Changelog line format is incorrect."
            echo "Expected format: ## [$VERSION] - YYYY-MM-DD"
            echo "Found: $CHANGELOG_LINE"
            exit 1
          fi

          echo "✓ Extracted release date from CHANGELOG.md: $RELEASE_DATE"

          # Extract version section first
          VERSION_SECTION=$(awk -v ver="$VERSION" '/^## \[/ {if (p) exit; if ($0 ~ "\\[" ver "\\]") p=1; next} p' CHANGELOG.md)

          if [ -z "$VERSION_SECTION" ]; then
            echo "❌ ERROR: Could not extract version section for [$VERSION] from CHANGELOG.md"
            exit 1
          fi

          echo "✓ Found version section (first 10 lines):"
          echo "$VERSION_SECTION" | head -10

          # Count total entries and PRIVATE entries in this version
          TOTAL_ENTRIES=$(echo "$VERSION_SECTION" | grep -c "^- " || true)
          PRIVATE_COUNT=$(echo "$VERSION_SECTION" | grep -c "\*\*\[PRIVATE\]\*\*" || true)
          USER_FACING_COUNT=$((TOTAL_ENTRIES - PRIVATE_COUNT))
          echo "📌 Found $USER_FACING_COUNT user-facing entries ($TOTAL_ENTRIES total, $PRIVATE_COUNT private) in this version"

          # Extract all entries except PRIVATE and save to temp file
          # Using ASCII control characters as delimiters (RS=0x1E, US=0x1F) to avoid collision with user content
          echo "$VERSION_SECTION" | awk '
            function flush() {
              if (collecting && entry != "" && !is_private) {
                printf "%s\036%s\n", category, entry;
              }
              collecting = 0;
              entry = "";
              is_private = 0;
            }

            /^## \[/ {
              flush();
              next;
            }

            /^### / {
              flush();
              category = $2;
              next;
            }

            /^- / {
              flush();
              # Check if this entry is marked as PRIVATE
              if ($0 ~ /\*\*\[PRIVATE\]\*\*/) {
                is_private = 1;
              } else {
                is_private = 0;
              }
              collecting = 1;
              
              # Remove [PUBLIC] tag
              gsub(/\*\*\[PUBLIC\]\*\* /, "");
              
              # --- NEW LOGIC: REMOVE ISSUE REFERENCES ---
              # Remove patterns like [#123](http://...) or [#123](<link>)
              gsub(/ *\[#[0-9]+\]\([^)]*\)/, "");
              # Remove simple issue references like [#123]
              gsub(/ *\[#[0-9]+\]/, "");

              # Keep the entire line including the leading "- "
              entry = $0;
              next;
            }

            collecting && /^[[:space:]]+-/ {
              # Clean issue references from continuation lines as well
              current_line = $0;
              gsub(/ *\[#[0-9]+\]\([^)]*\)/, "", current_line);
              gsub(/ *\[#[0-9]+\]/, "", current_line);

              entry = entry "\037" current_line;
              next;
            }

            collecting {
              flush();
            }

            END {
              flush();
            }
          ' > /tmp/public_changelog.txt

          if [ ! -s /tmp/public_changelog.txt ]; then
            echo "⚠️  No user-facing entries found for this version (all entries are marked as [PRIVATE]). Skipping PR creation."
            echo "SKIP_PR=true" >> $GITHUB_ENV
            echo "RELEASE_DATE=$RELEASE_DATE" >> $GITHUB_ENV
            exit 0
          fi

          echo "✅ Successfully extracted user-facing entries (excluding [PRIVATE]):"
          head -5 /tmp/public_changelog.txt

          echo ""
          echo "🐍 Converting to JSON..."

          # Convert to JSON using Python
          CHANGELOG_JSON_FEATURES=$(python3 << 'PYTHON_SCRIPT'
          import sys
          import json

          def convert_to_json_features(changelog_text):
              """Convert changelog entries to JSON features array with preserved indentation."""
              features = []

              lines = changelog_text.strip().split('\n')

              for i, line in enumerate(lines):
                  if not line:
                      continue

                  # Each line format: Category<RS>content<US>sub-item
                  # RS (0x1E) = Record Separator, US (0x1F) = Unit Separator
                  parts = line.split('\x1e', 1)  # ASCII RS (Record Separator)
                  if len(parts) != 2:
                      continue

                  category = parts[0]
                  content = parts[1]

                  # Convert unit separators to actual newlines (preserves 2-space indentation)
                  content = content.replace('\x1f', '\n')  # ASCII US (Unit Separator)

                  features.append({
                      "type": "text",
                      "content": content,
                      "category": category
                  })

              return features

          # Read from file
          with open('/tmp/public_changelog.txt', 'r') as f:
              changelog_text = f.read()

          # Convert
          features = convert_to_json_features(changelog_text)

          # Output as compact JSON array
          output = ','.join([json.dumps(f) for f in features])
          print(output)
          PYTHON_SCRIPT
          )

          echo "✅ JSON conversion complete"
          echo "Features JSON length: ${#CHANGELOG_JSON_FEATURES}"

          # Generate final JSON
          JSON_CONTENT=$(printf '{"system":"%s","date":"%s","version":"%s","features":[%s]}' \
            "$SYSTEM_NAME" \
            "$RELEASE_DATE" \
            "$VERSION" \
            "$CHANGELOG_JSON_FEATURES")

          # Create a URL-friendly slug from system name (lowercase, spaces to dashes)
          SYSTEM_NAME_SLUG="${SYSTEM_NAME,,}"  # Convert to lowercase
          SYSTEM_NAME_SLUG="${SYSTEM_NAME_SLUG// /-}"  # Replace spaces with dashes
          FILE_NAME="${RELEASE_DATE}-${SYSTEM_NAME_SLUG}-${VERSION}.json"

          # Write JSON directly to a temporary file to avoid issues with special characters
          echo "$JSON_CONTENT" > /tmp/changelog.json

          # Validate JSON
          python3 -m json.tool /tmp/changelog.json > /dev/null && echo "✓ JSON is valid" || echo "✗ JSON validation failed"

          # Save outputs
          echo "SKIP_PR=false" >> $GITHUB_ENV
          echo "RELEASE_DATE=$RELEASE_DATE" >> $GITHUB_ENV
          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "FILE_PATH=$WEBSITE_CHANGELOG_DIR/$FILE_NAME" >> $GITHUB_OUTPUT
          echo "SYSTEM_NAME=$SYSTEM_NAME" >> $GITHUB_OUTPUT
          echo "PR_TITLE=feat(changelog): Add changelog for ${SYSTEM_NAME} v${VERSION}" >> $GITHUB_OUTPUT

      - name: Checkout Website Repository
        if: env.SKIP_PR == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.website_repo }}
          token: ${{ secrets.personal_access_token }}
          path: website

      - name: Write JSON File to Website Repository
        if: env.SKIP_PR == 'false'
        env:
          WEBSITE_CHANGELOG_DIR: ${{ secrets.website_changelog_dir }}
        run: |
          # Create file in the website repository
          DESTINATION_DIR="website/$WEBSITE_CHANGELOG_DIR"
          mkdir -p "$DESTINATION_DIR"
          FULL_FILE_PATH="$DESTINATION_DIR/${{ steps.extract_and_generate.outputs.FILE_NAME }}"

          echo "📝 Writing JSON to: $FULL_FILE_PATH"
          cp /tmp/changelog.json "$FULL_FILE_PATH"

          echo "✅ File created successfully"

          # Validate JSON
          python3 -m json.tool "$FULL_FILE_PATH" > /dev/null && echo "✓ JSON is valid" || echo "✗ JSON validation failed"

      - name: Create Pull Request on Website Repository
        if: env.SKIP_PR == 'false'
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.personal_access_token }}
          path: website
          base: ${{ inputs.stage_branch }}
          commit-message: ${{ steps.extract_and_generate.outputs.PR_TITLE }}
          branch: "changelog/${{ steps.extract_and_generate.outputs.FILE_NAME }}"
          delete-branch: true
          title: ${{ steps.extract_and_generate.outputs.PR_TITLE }}
          body: |
            This PR automatically adds the latest changelog for the **${{ steps.extract_and_generate.outputs.SYSTEM_NAME }}** system.

            - **Version:** `${{ steps.get_version.outputs.VERSION }}`
            - **Date:** `${{ env.RELEASE_DATE }}`

            By merging this PR, the changes will be visible on the website after the next deployment.
          add-paths: |
            ${{ steps.extract_and_generate.outputs.FILE_PATH }}

      - name: Auto-merge PR
        if: env.SKIP_PR == 'false' && steps.create_pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.personal_access_token }}
        run: |
          cd website
          PR_NUMBER="${{ steps.create_pr.outputs.pull-request-number }}"
          echo "🔀 Auto-merging PR #$PR_NUMBER"
          gh pr merge $PR_NUMBER --merge --delete-branch
          echo "✅ PR merged successfully"

      - name: Open promotion PR (stage → base)
        if: env.SKIP_PR == 'false' && steps.create_pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.personal_access_token }}
          GH_REPO: ${{ secrets.website_repo }}
          PR_TITLE: ${{ steps.extract_and_generate.outputs.PR_TITLE }}
          SYSTEM_NAME: ${{ inputs.name }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          STAGE_BRANCH: ${{ inputs.stage_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          # The changelog PR was just auto-merged into the staging branch. Promote it to the
          # (typically protected) base branch via a PR — opened only, since a human must clear
          # the base branch's protection. If a stage → base PR is already open, it will pick
          # up this merge automatically, so we skip.
          existing=$(gh pr list --base "$BASE_BRANCH" --head "$STAGE_BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Open PR #$existing already promotes $STAGE_BRANCH → $BASE_BRANCH; skipping."
            exit 0
          fi
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$STAGE_BRANCH" \
            --title "$PR_TITLE" \
            --body "Promotes the merged **$SYSTEM_NAME** changelog (\`$VERSION\`) from \`$STAGE_BRANCH\` to \`$BASE_BRANCH\`."

      - name: Extract issue numbers from CHANGELOG
        id: extract_issues
        run: |
          TAG_NAME="${{ steps.get_version.outputs.VERSION }}"
          VERSION=${TAG_NAME#v}

          # Extract the section for this version from CHANGELOG.md
          CHANGELOG_SECTION=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit;
              if ($0 ~ "\\[" ver "\\]") found=1;
              next;
            }
            found { print }
          ' CHANGELOG.md)

          # Extract issue numbers from pattern [#123]
          ISSUE_NUMBERS=$(echo "$CHANGELOG_SECTION" | grep -oE '\[#[0-9]+\]' | grep -oE '[0-9]+' | sort -u || true)

          echo "issue_numbers<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_NUMBERS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Close issues with comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.get_version.outputs.VERSION }}"
          TAG_URL="${{ steps.get_version.outputs.URL }}"
          ISSUE_NUMBERS="${{ steps.extract_issues.outputs.issue_numbers }}"

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No issues found in CHANGELOG for this version"
            exit 0
          fi

          echo "Found issues: $ISSUE_NUMBERS"

          # Close each issue with a comment
          for ISSUE_NUMBER in $ISSUE_NUMBERS; do
            echo "Processing issue #$ISSUE_NUMBER"

            # Check if issue exists and is open
            ISSUE_STATE=$(gh issue view $ISSUE_NUMBER --json state --jq '.state' 2>/dev/null || echo "not_found")

            if [ "$ISSUE_STATE" = "OPEN" ]; then
              echo "Closing issue #$ISSUE_NUMBER"

              # Add comment and close issue
              gh issue comment $ISSUE_NUMBER --body "This issue has been resolved and released in [$TAG_NAME]($TAG_URL) 🎉"
              gh issue close $ISSUE_NUMBER --reason completed

              echo "✅ Closed issue #$ISSUE_NUMBER"
            elif [ "$ISSUE_STATE" = "CLOSED" ]; then
              echo "⚠️  Issue #$ISSUE_NUMBER is already closed"
            else
              echo "⚠️  Issue #$ISSUE_NUMBER not found"
            fi
          done

      - name: Summary
        run: |
          echo "🏷️  Tag: ${{ steps.get_version.outputs.VERSION }}"
          echo "🔗 Release: ${{ steps.get_version.outputs.URL }}"
          echo "✅ Issue processing completed"
